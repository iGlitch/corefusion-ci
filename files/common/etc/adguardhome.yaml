    - sdns://AQMAAAAAAAAAETk0LjE0MC4xNC4xNDo1NDQzINErR_JS3PLCu_iZEIbq95zkSV2LFsigxDIuUso_OQhzIjIuZG5zY3J5cHQuZGVmYXVsdC5uczEuYWRndWFyZC5jb20
    - '#quad9'
    - sdns://AQMAAAAAAAAADDkuOS45Ljk6ODQ0MyBnyEe4yHWM0SAkVUO-dWdG3zTfHYTAC4xHA2jfgh2GPhkyLmRuc2NyeXB0LWNlcnQucXVhZDkubmV0
    - '#Mullvad'
    - https://base.dns.mullvad.net/dns-query
    - '#CloudFlare Security 1.1.1.2'
    - '#sdns://AgMAAAAAAAAABzEuMC4wLjIAG3NlY3VyaXR5LmNsb3VkZmxhcmUtZG5zLmNvbQovZG5zLXF1ZXJ5'
    - '#ControlD'
    - '#https://freedns.controld.com/no-ads-malware-typo'
  upstream_dns_file: ""
  bootstrap_dns:
    - 9.9.9.10
    - 149.112.112.10
    - 2620:fe::10
    - 2620:fe::fe:10
  fallback_dns: []
  upstream_mode: parallel
  fastest_timeout: 5s
  allowed_clients:
    - 127.0.0.1
    - 192.168.1.0/24
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
    - .lan
    - .home.arpa
  trusted_proxies:
    - 127.0.0.0/8
    - ::1/128
  cache_size: 4194304
  cache_ttl_min: 3600
  cache_ttl_max: 3600
  cache_optimistic: true
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: true
  edns_client_subnet:
    custom_ip: ""
    enabled: true
    use_custom: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  ipset_file: ""
  bootstrap_prefer_ipv6: false
  upstream_timeout: 10s
  private_networks: []
  use_private_ptr_resolvers: false
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
  hostsfile_enabled: true
  pending_requests:
    enabled: true
tls:
  enabled: false
  server_name: ""
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 0
  dnscrypt_config_file: ""
  allow_unencrypted_doh: false
  certificate_chain: ""
  private_key: ""
  certificate_path: ""
  private_key_path: ""
  strict_sni_check: false
querylog:
  dir_path: ""
  ignored: []
  interval: 6h
  size_memory: 1103
  enabled: false
  file_enabled: true
statistics:
  ignored: []
  interval: 24h
  enabled: false
filters:
  - enabled: true
    url: https://big.oisd.nl
    name: OISD Big
    id: 1695911832
whitelist_filters:
  - enabled: true
    url: https://raw.githubusercontent.com/iGlitch/adblock-filter-compiler/main/whitelist.txt
    name: Glitch's Whitelist
    id: 1695911831
user_rules:
  - /.*?xn--.*\.[a-z][a-z][a-z]?\.?[a-z]?[a-z]?[a-z]?/
  - /^(.+[_.-])?adse?rv(er?|ice)?s?[0-9]*[_.-]/
  - /^(.+[_.-])?telemetry[_.-]/
  - /^ad([sxv]?[0-9]*|system)[_.-]([^.[:space:]]+\.){1,}|[_.-]ad([sxv]?[0-9]*|system)[_.-]/
  - /^adim(age|g)s?[0-9]*[_.-]/
  - /^adtrack(er|ing)?[0-9]*[_.-]/
  - /^advert(s|is(ing|ements?))?[0-9]*[_.-]/
  - /^aff(iliat(es?|ion))?[_.-]/
  - /^analytics?[_.-]/
  - /^banners?[_.-]/
  - /^beacons?[0-9]*[_.-]/
  - /^count(ers?)?[0-9]*[_.-]/
  - /^mads\./
  - /^matomo?[_.-]/
  - /^pixels?[-.]/
  - /^stat(s|istics)?[0-9]*[_.-]/
  - /lemon/
  - /masterconn/
  - /safebrowsing/
dhcp:
  enabled: true
  interface_name: br-lan
  local_domain_name: home.arpa
  dhcpv4:
    gateway_ip: 192.168.1.1
    subnet_mask: 255.255.255.0
    range_start: 192.168.1.100
    range_end: 192.168.1.200
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options:
      - 15 text home.arpa
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
filtering:
  blocking_ipv4: '::'
  blocking_ipv6: '::'
  blocked_services:
    schedule:
      time_zone: UTC
    ids: []
  protection_disabled_until: null
  safe_search:
    enabled: false
    bing: true
    duckduckgo: true
    google: true
    pixabay: true
    yandex: true
    youtube: true
  blocking_mode: default
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  rewrites: []
  safe_fs_patterns:
    - /tmp/adguardhome/data/userfilters/*
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 24
  blocked_response_ttl: 10
  filtering_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  protection_enabled: true
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []
log:
  enabled: false
  file: ""
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: false
  local_time: false
  verbose: false
os:
  group: ""
  user: ""
  rlimit_nofile: 0
schema_version: 34
