name: build

on:
  schedule:
    - cron: '0 3 */5 * *'
  workflow_dispatch:
  push:
    paths: ['configs/**', 'patches/**', 'files/**', '.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # one entry drives configs/<name>.config and files/<name>/
        config: [mvebu, ubi]

    steps:
      - uses: actions/checkout@v7

      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af
          df -h /

      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          git config user.name  "Glitch"
          git config user.email "wrt@glitchery.jp"
          echo "OPENWRT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Feeds
        working-directory: openwrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Patches, files, config
        working-directory: openwrt
        run: |
          shopt -s nullglob
          patches=(../patches/*.patch)
          if [ ${#patches[@]} -gt 0 ]; then git am "${patches[@]}"; fi

          overlay=package/base-files/files
          cp -R ../files/common/. "$overlay"
          target=../files/${{ matrix.config }}
          if [ -d "$target" ]; then cp -R "$target/." "$overlay"; fi

          find "$overlay" -type f \
            \( -path '*/etc/init.d/*' -o -name '*.sh' -o -path '*/usr/bin/*' \) \
            -exec chmod +x {} +

          cp "../configs/${{ matrix.config }}.config" .config
          make defconfig

      - name: Build
        working-directory: openwrt
        run: |
          make -j$(nproc) download clean world V=sc

      - name: Collect images
        run: |
          mkdir -p out
          find openwrt/bin/targets -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.img' -o -name '*.img.gz' -o -name '*.ubi' -\) -exec cp {} out/ \;
          for f in openwrt/bin/targets/*/*/sha256sums; do
            cp "$f" "out/sha256sums-${{ matrix.config }}.txt"
          done
          ls -la out

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(date +%Y%m%d)
          gh release create "$tag" --title "$tag" \
            --notes "OpenWrt master @ $OPENWRT_SHA" 2>/dev/null || true
          gh release upload "$tag" out/* --clobber
